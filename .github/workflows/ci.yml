name: XAIOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every budget in tests/ was written on an Apple-silicon Mac. A GitHub runner
# has no hardware virtualisation, so each guest is interpreted and the same work
# takes several times longer: the outbound-fragmentation step runs in 96 to 98
# seconds there, across five consecutive runs, and exceeded its 360-second
# budget on every run here.
#
# Declared rather than detected. A gate that sniffs at its host will eventually
# guess wrong and quietly give itself more room, and a budget that moves on its
# own has stopped being a budget. See qemu_gate_lib.timeout_scale.
env:
  XAIOS_GATE_TIMEOUT_SCALE: "3"

jobs:
  hosted-c99-libc:
    # The name said two architectures; the gate has iterated three since the
    # RISC-V port landed. B-66: it ran the RISC-V leg on a runner with no
    # RISC-V emulator, and reported markers the guest had not printed about a
    # guest that was never started.
    name: Hosted C99 libc (ARM64, x86_64 and RISC-V)
    runs-on: ubuntu-latest
    # Three architectures under TCG, and the RISC-V leg alone is allowed 720
    # seconds of boot on top of building three userlands.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install libc and QEMU dependencies
        run: |
          sudo apt-get update
          # qemu-system-misc is where qemu-system-riscv64 lives. No
          # qemu-efi-riscv64: this gate boots the RISC-V leg through OpenSBI,
          # which QEMU ships, and installing firmware it does not use would
          # only hide the day it starts needing some.
          sudo apt-get install -y clang lld llvm meson ninja-build qemu-system-arm qemu-efi-aarch64 qemu-system-x86 qemu-system-misc ovmf mtools python3 python3-cryptography

      - name: Build and run the current hosted C99 gates
        run: make qemu-libc-gate

      - name: Upload libc evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-c99-libc-evidence
          path: |
            build/libc/*/sysroot/manifest.json
            build/libc/*/runtime-test/*.elf
            build/libc/c99-conformance-report.json
            build/qemu-libc-*.log
          if-no-files-found: ignore
          retention-days: 14

  compile-check:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build python3

      - name: Compile-check kernel C files
        run: make compile-check

      # The hosted WebTransport port is excluded from the freestanding sweep --
      # it builds against the vendored tree's headers and the hosted sysroot,
      # which `make compile-check` has just built as a dependency of `libc`.
      # This is where its three architectures are checked, with the flags it is
      # actually built with.
      - name: Compile the WebTransport port for every architecture
        run: make wt-upstream-compile

  hosted-engine:
    name: Hosted Engine & Model v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          sudo apt-get update
          # mtools: tests/storage/test_fat.c cross-checks the volume XAIOS
          # writes against mdir, so `make hosted-test` needs it. Without it
          # the job failed with "/bin/sh: 2: mdir: not found" and then
          # "mtools cannot see BOOTRISCV64.EFI on the volume XAIOS wrote",
          # which reads as a filesystem defect and is a missing package.
          sudo apt-get install -y clang mtools python3 python3-cryptography

      - name: Run hosted engine tests
        run: make hosted-test
      # The xapt repository tool keeps its own tests, and nothing ran them:
      # by the time anyone looked, the fixture had been passing a three-part
      # version to a tool that has required a whole build number since the
      # project moved off semver, and the target had been red the whole time
      # (B-98).
      - name: Run xapt repository tests
        run: make xapt-test

  documentation-contract:
    name: Documentation Contract
    runs-on: ubuntu-latest
    steps:
      # Full history. docs-check asks when each document last changed, and a
      # depth-1 clone has one commit, so git answers "at HEAD" for every file
      # in the tree -- which fails a document nobody touched as soon as a
      # commit lands on a later day, and never notices one that really is
      # stale. The check now declines to guess when history is shallow, so
      # without this it would pass without checking anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check documentation and contract synchronization
        run: make docs-check

  wt-host-tests:
    name: WebTransport Host Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          # python3-cryptography is what re-verifies the generated ECDSA and
          # QUIC flight fixtures. Without it those steps fail on import, and
          # the failure would look like a broken fixture rather than a missing
          # package -- the same trap B-58 records for mdir.
          sudo apt-get install -y clang python3 python3-cryptography

      # The RFC 8448 and RFC 9001 values recomputed from the RFCs themselves,
      # by an implementation that shares no code with the one under test. This
      # runs before the tests so that a wrong vector is reported as a wrong
      # vector and not as a failing module.
      - name: Re-derive the RFC vectors independently
        run: make wt-vectors-check

      # The two generated fixtures are re-verified rather than regenerated:
      # ECDSA signing and RSA-PSS signing both draw a random nonce, so a
      # rewrite would produce a different but equally valid fixture every run.
      # Re-verifying them against the `cryptography` package is what keeps a
      # corrupted header from being believed.
      - name: Re-verify the generated fixtures
        run: |
          python3 tests/security/generate_wt_ecdsa_vectors.py
          python3 tests/security/generate_wt_quic_flight.py

      # The TLS 1.3, QUIC packet and certificate code is host-testable because
      # it takes handshake messages rather than sockets, so this is where it is
      # actually checked: the target has no way to print a digest and compare it
      # to an RFC.
      - name: WebTransport host tests
        run: make wt-host-test

      # The same suites under AddressSanitizer and UndefinedBehaviorSanitizer.
      # Both of the memory-safety defects found in this module so far were
      # found by the sanitizer run and not by the plain one.
      - name: WebTransport host tests under the sanitizers
        run: make wt-host-sanitize

      # The port's own client and server meeting over a real UDP socket: the
      # vendored library driven by this repository's crypto, key share, trust
      # and signature code. It needs no OpenSSL, and a completed handshake here
      # is the claim the QEMU gate makes about a booted guest.
      - name: WebTransport handshake interop
        run: make wt-interop-test

  abi-contract:
    name: ABI Contract Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Validate ABI contract
        run: python3 tests/scripts/qemu-abi-contract.py

  netboot:
    name: Network Boot (no kernel on the medium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build qemu-system-arm qemu-efi-aarch64 mtools python3 python3-cryptography

      - name: Build disk image
        run: make image-qemu-test

      # A medium holding the loader and nothing else, a machine that installs
      # itself onto a blank disk from what it booted with, and that disk booted
      # alone. Nothing else exercises the embedded-payload path, and its
      # failure mode is a machine that boots and then cannot find a kernel.
      - name: Network boot and self-install
        run: python3 tests/scripts/qemu-netboot-gate.py
        env:
          XAIOS_NETBOOT_TIMEOUT: "360"

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: netboot-logs
          path: |
            build/netboot-gate-*.log
            build/qemu-netboot-gate.json
          if-no-files-found: ignore

  installed-disk:
    name: Installed Disk (one drive, nothing attached)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build qemu-system-arm qemu-efi-aarch64 mtools python3 python3-cryptography

      # Boots a machine XAIOS has been installed onto rather than the test
      # bench: one disk, a GPT, an EFI System Partition and a state partition
      # the kernel finds by type because nothing tells it where to look. The
      # transport lookup by ordinal, transitional virtio PCI device IDs and
      # mapping above 512 GiB are all exercised here and nowhere else, so
      # without this job they can break with every other job still green.
      - name: Installed disk boot and self-install
        run: python3 tests/scripts/qemu-installed-disk-gate.py
        env:
          XAIOS_INSTALLED_DISK_TIMEOUT: "300"

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installed-disk-logs
          path: |
            build/installed-disk-boot*.log
            build/install-run.log
            build/installed-by-xaios.log
            build/qemu-installed-disk-gate.json
          if-no-files-found: ignore

  build-and-smoke:
    name: Build & QEMU Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build qemu-system-arm qemu-efi-aarch64 mtools python3 python3-cryptography

      - name: Build disk image
        run: make image-qemu-test

      - name: QEMU smoke test
        run: python3 tests/scripts/qemu-smoke.py

      # The update path: two transactions staged, one committed, one failed and
      # recovered, a rollback, and a boot fallback -- asked of this machine the
      # same way it is asked of the other two. Nothing ran it in CI before, so
      # "it updates itself" was evidenced by a gate no job invoked (B-112).
      - name: Update transactions, rollback and boot fallback
        run: make qemu-update-gate

      # The panic path: three controlled faults, one of each kind, each of
      # which has to be taken, identified and reported. No job ran this gate on
      # any architecture before (B-112), and it is the only thing that asks the
      # question the panic machinery exists to answer.
      - name: Controlled page, read-only and NX faults
        run: make qemu-fault-matrix
        env:
          XAIOS_QEMU_SMOKE_TIMEOUT: "120"

      # WT-35: the kernel naming a datagram socket, which is what a QUIC
      # client has before its first packet. It reads the kernel's own
      # allocation log and what the caller was told, so a write-back that
      # silently does not land is caught here rather than by a peer that
      # never answers.
      - name: Ephemeral datagram socket ports
        run: make qemu-datagram-ephemeral-port-gate
        env:
          XAIOS_EPHEMERAL_UDP_TIMEOUT: "300"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts
          path: |
            build/*.img
            build/kernel/kernel.elf
            build/uefi/BOOTAA64.EFI
            build/qemu-milestone-68-update-gate.json
            build/qemu-smoke.log
            build/qemu-fault-matrix-aarch64-*.log
          retention-days: 7

  storage-crash-safety:
    name: Storage Crash Safety (power cut mid-write)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build \
            qemu-system-arm qemu-efi-aarch64 mtools python3 \
            python3-cryptography

      # Kills the emulator outright at random points while a model package is
      # being ingested, then hashes every chunk the surviving catalog still
      # calls complete. Four trials rather than the default eight: each is a
      # full boot, and four is enough for the surviving generations to differ,
      # which the gate requires.
      - name: Cut power to a machine mid-write
        run: make qemu-crash-safety-gate
        env:
          XAIOS_CRASH_TRIALS: "4"
          XAIOS_CRASH_BOOT_TIMEOUT: "420"

      # The other half of power-loss safety: that the flushes the argument
      # depends on are actually issued. The emulator never loses an
      # acknowledged write, so nothing else would notice if one went missing.
      - name: Check the write ordering a volatile cache would expose
        run: make qemu-write-ordering-gate
        env:
          XAIOS_WRITE_ORDERING_TIMEOUT: "600"

      # Throughput, and the one assertion that has teeth: a warm read must beat
      # a cold one, or the read cache is not doing anything.
      - name: Measure storage throughput and the read cache
        run: make qemu-storage-bench
        env:
          XAIOS_STORAGE_BENCH_TIMEOUT: "900"

      - name: Upload the crash and throughput reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storage-evidence
          path: |
            build/qemu-crash-safety-gate.json
            build/qemu-write-ordering-gate.json
            build/qemu-storage-bench.json
            build/crash-trial-*.log
            build/qemu-storage-bench.log
            build/qemu-storage-crash-failure.log
          retention-days: 7

  release-images:
    name: Release Images (one per architecture, every environment available)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # xorriso builds the hybrid images; all three QEMU architectures and
      # their firmwares are needed because the point of this job is that each
      # shipped file boots the machine it is for.
      - name: Install toolchain and all three QEMU architectures
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build \
            qemu-system-arm qemu-efi-aarch64 qemu-system-x86 ovmf \
            qemu-system-misc qemu-efi-riscv64 \
            xorriso mtools python3 python3-cryptography

      # Each architecture's payload and then its image, with the applications,
      # because the gate asserts the shell command surface and that only exists
      # in a test-apps build.
      #
      # The three run in sequence rather than as three jobs: they share build/,
      # and the gate has to see all three images at once.
      - name: Build the three release images
        run: make release-images

      # VMware Fusion and Virtualization.framework do not exist on a Linux
      # runner, so the gate reports them as skipped and passes on the three it
      # can run. That is the honest result: it proves each shipped image boots
      # its own architecture -- AArch64, x86_64 and RISC-V -- and claims
      # nothing about the hypervisors, which are covered by make
      # release-image-gate on a macOS host.
      - name: Boot each release image on every environment available here
        run: make release-image-gate
        env:
          XAIOS_RELEASE_QEMU_TIMEOUT: "600"

      - name: Upload the release images and the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-images
          path: |
            build/xaios_b*-aarch64.iso
            build/xaios_b*-x86_64.iso
            build/xaios_b*-riscv64.iso
            build/release-image-gate.json
            build/release-qemu-*.log
          retention-days: 7

  x86-bring-up:
    name: x86_64 Bring-up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install x86_64 QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build qemu-system-x86 ovmf mtools python3

      - name: Run SMP x86_64 smoke
        run: make qemu-x86_64-smoke
        env:
          XAIOS_QEMU_X86_SMOKE_TIMEOUT: "120"

      - name: Run conservative FXSAVE fallback
        run: python3 tests/scripts/qemu-x86_64-smoke.py
        env:
          XAIOS_QEMU_X86_CPU: qemu64
          XAIOS_QEMU_X86_SMP: "1"
          XAIOS_QEMU_X86_MEMORY: 512M
          XAIOS_QEMU_X86_SMOKE_TIMEOUT: "120"

      - name: Run Intel server high-MMIO layout
        run: python3 tests/scripts/qemu-x86_64-smoke.py
        env:
          XAIOS_QEMU_X86_CPU: Skylake-Server
          XAIOS_QEMU_X86_SMOKE_TIMEOUT: "120"

      # The install path on this architecture: a running machine writes a
      # bootable disk, and that disk is booted on its own with nothing else
      # attached. Only the AArch64 job ran it before, so the x86_64 and RISC-V
      # profiles of the same gate were exercised nowhere -- and the RISC-V one
      # was in fact broken, unnoticed, because no build ever ran it.
      - name: Update transactions, rollback and boot fallback
        run: make qemu-x86_64-update-gate

      - name: Controlled page, read-only and NX faults
        run: make qemu-x86_64-fault-matrix

      - name: Installed disk boot and self-install
        run: make qemu-x86_64-installed-disk-gate
        env:
          XAIOS_INSTALLED_DISK_TIMEOUT: "300"

      - name: Upload x86_64 installed-disk logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: x86_64-installed-disk-logs
          path: |
            build/installed-disk-boot*-x86_64.log
            build/install-run-x86_64.log
            build/installed-by-xaios-x86_64.log
            build/qemu-installed-disk-gate-x86_64.json
            build/qemu-milestone-68-update-gate.json
            build/qemu-smoke-x86_64.log
            build/qemu-fault-matrix-x86_64-*.log
          if-no-files-found: ignore

      - name: Upload x86_64 artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: x86_64-bring-up-artifacts
          path: |
            build/xaios-x86_64.img
            build/kernel-x86_64/kernel.elf
            build/uefi-x86_64/BOOTX64.EFI
          if-no-files-found: ignore
          retention-days: 7

  riscv-bring-up:
    name: RISC-V Bring-up
    runs-on: ubuntu-latest
    # Above what the steps can use between them, so a step that hangs is killed
    # by its own budget and named. The CPU tier step below may build QEMU on a
    # cold cache, which is the longest thing in this job by a wide margin.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # qemu-system-misc carries qemu-system-riscv64, and QEMU ships the
      # OpenSBI firmware this board boots through, so there is no separate
      # firmware package to install the way ovmf is for x86_64.
      - name: Install RISC-V QEMU dependencies
        run: |
          sudo apt-get update
          # The trailing packages past python3 are not for running XAIOS: they
          # are what building QEMU from source needs, for the CPU tier step
          # below. On a warm cache nothing is built and they go unused, which
          # is cheaper than branching an apt invocation on a cache hit.
          sudo apt-get install -y clang lld llvm meson ninja-build qemu-system-misc mtools python3 \
            build-essential git libfdt-dev libglib2.0-dev libpixman-1-dev libslirp-dev pkg-config python3-venv zlib1g-dev

      # The boot-test configuration, which is what the other two architectures
      # smoke here as well.
      - name: Run RISC-V smoke
        run: make qemu-riscv64-smoke
        env:
          XAIOS_QEMU_SMOKE_TIMEOUT: "600"

      - name: Update transactions, rollback and boot fallback
        run: make qemu-riscv64-update-gate
        env:
          XAIOS_QEMU_SMOKE_TIMEOUT: "600"

      # The panic path on the third machine. This was left out when the other
      # two were added, on the belief that this job was near its 90-minute cap
      # -- which was never measured. It runs in about seven minutes end to end,
      # so the belief was wrong and the step belongs here (B-112).
      - name: Controlled page, read-only and NX faults
        run: make qemu-riscv64-fault-matrix
        env:
          XAIOS_QEMU_SMOKE_TIMEOUT: "600"

      # The release configuration, which is what actually ships and which no
      # boot-test gate exercises: there, shell commands are kernel built-ins
      # and no application is ever launched as a process. That difference cost
      # a day once and is worth a CI step.
      - name: Run RISC-V release configuration
        run: make qemu-riscv64-release-gate
        env:
          XAIOS_QEMU_SMOKE_TIMEOUT: "600"

      # One disk, a GPT, an ESP and a state partition found by type, booted
      # twice: the same property the AArch64 installed-disk job tests, on the
      # architecture where nothing tested it.
      #
      # NOT added yet, and the reason is recorded rather than left as an
      # absence: the gate runs now, and its first boot of an installed disk
      # fails on this architecture (`B-104`). A step added here would be red on
      # every run until that is closed, which is not the same thing as a job
      # that reports a real failure once. What the AArch64 `installed-disk` job
      # does already cover is the class of defect that let this architecture rot
      # unnoticed: the gate validates every profile's required keys on every
      # invocation, so a profile missing one fails that job by name (control run:
      # deleting the riscv64 key fails the AArch64 run with
      # "the riscv64 profile is missing esp_bytes_digits").

      # Ubuntu 24.04 ships QEMU 8.2.2, which models five of the twelve CPU
      # tiers the contract lists. The other seven postdate it and nothing
      # newer exists in noble or its backports, so the emulator is built and
      # cached by commit. The two steps above deliberately keep running on the
      # distribution's QEMU: they pass there, and a gate that only ever runs
      # against a hand-built emulator stops saying anything about the one
      # everybody else has.
      - name: Restore pinned RISC-V QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xaios-qemu-riscv64
          key: qemu-riscv64-tiers-${{ runner.os }}-${{ runner.arch }}-5e35f26695645b20931e10d8567c7e0169e62c07-v1

      - name: Provision RISC-V QEMU
        run: |
          tests/scripts/provision-qemu-riscv64.sh
          echo "QEMU_SYSTEM_RISCV64=${XAIOS_QEMU_RISCV64_ROOT}/5e35f26695645b20931e10d8567c7e0169e62c07/build/qemu-system-riscv64" >> "$GITHUB_ENV"
        env:
          XAIOS_QEMU_RISCV64_ROOT: ${{ runner.temp }}/xaios-qemu-riscv64

      # Sv48 and Sv39 harts in one run. Six of the thirteen CPU models QEMU
      # implements offer Sv39 and no more, including both standard RISC-V
      # application profiles, and until recently the kernel could not boot on
      # any of them. Nothing outside a developer's machine has checked that
      # since.
      - name: Run RISC-V CPU tiers
        run: python3 tests/scripts/qemu-cpu-matrix.py --arch riscv64

      - name: Upload RISC-V artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: riscv64-bring-up-artifacts
          path: |
            build/xaios-riscv64-initfs.img
            build/kernel-riscv64/kernel.elf
            build/qemu-cpu-matrix-report.json
            build/cpu-matrix-riscv64/*/console.log
            build/qemu-milestone-68-update-gate.json
            build/qemu-smoke-riscv64.log
            build/qemu-fault-matrix-riscv64-*.log
          if-no-files-found: ignore
          retention-days: 7

  core-os-release-candidate:
    name: Core OS Aggregate RC
    runs-on: ubuntu-latest
    # Above the sum the steps can actually use, so a step that hangs is killed
    # by its own budget and named, rather than taking the job down anonymously.
    timeout-minutes: 90
    steps:
      # Full history, for the same reason as the Documentation Contract job:
      # this aggregate runs docs-check, and the review-date comparison inside
      # it needs to be able to see when a file actually changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install AArch64 and x86_64 test dependencies
        run: |
          sudo apt-get update
          # qemu-system-misc and qemu-efi-riscv64: this job drives
          # qemu-core-os-rc, which runs qemu-nvme-gate and
          # qemu-outbound-fragmentation-gate -- and both of those have
          # riscv64 among their prerequisites. The pinned QEMU built below
          # is qemu-system-aarch64 only, so this runner had no RISC-V
          # emulator at all and the RISC-V legs could not run. It did not
          # show as a missing binary because the RISC-V runner died
          # earlier, on a missing models volume (B-56).
          sudo apt-get install -y build-essential clang git libfdt-dev libglib2.0-dev libpixman-1-dev libslirp-dev lld llvm meson ninja-build ovmf mtools pkg-config python3 python3-cryptography python3-venv qemu-efi-aarch64 qemu-efi-riscv64 qemu-system-arm qemu-system-misc qemu-system-x86 zlib1g-dev

      - name: Restore pinned SMMUv3 test QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xaios-qemu-smmu
          key: qemu-iommu-testdev-${{ runner.os }}-${{ runner.arch }}-6ce361b02c825b4a12a9684c47342859ee967cb2-v1

      - name: Provision SMMUv3 test QEMU
        run: |
          tests/scripts/provision-qemu-smmu-testdev.sh
          echo "XAIOS_QEMU_SMMU=${XAIOS_QEMU_SMMU_ROOT}/6ce361b02c825b4a12a9684c47342859ee967cb2/build/qemu-system-aarch64" >> "$GITHUB_ENV"
        env:
          XAIOS_QEMU_SMMU_ROOT: ${{ runner.temp }}/xaios-qemu-smmu

      # B-73: the nvme gate's riscv64-aia row hangs on the QEMU noble ships.
      # The NVMe async self-test passes, then the MSI-X self-test never reports
      # and the guest loops on "aia: identity=5 first message delivered" until
      # the deadline. Reproduced in tests/linux-parity against 8.2.2 and passing
      # in fourteen seconds against 11.1.1, so it is the emulator and not the
      # board being slow -- that row is the cheaper of the two RISC-V boards.
      # Same pin and same cache as the RISC-V Bring-up job.
      - name: Restore pinned RISC-V QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xaios-qemu-riscv64
          key: qemu-riscv64-tiers-${{ runner.os }}-${{ runner.arch }}-5e35f26695645b20931e10d8567c7e0169e62c07-v1

      - name: Provision RISC-V QEMU
        run: |
          tests/scripts/provision-qemu-riscv64.sh
          echo "QEMU_SYSTEM_RISCV64=${XAIOS_QEMU_RISCV64_ROOT}/5e35f26695645b20931e10d8567c7e0169e62c07/build/qemu-system-riscv64" >> "$GITHUB_ENV"
        env:
          XAIOS_QEMU_RISCV64_ROOT: ${{ runner.temp }}/xaios-qemu-riscv64

      - name: Run aggregate core OS gate
        run: make qemu-core-os-rc
        env:
          XAIOS_QEMU_SMOKE_TIMEOUT: "120"

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-os-rc-evidence
          path: |
            build/qemu-core-os-rc-*.log
            build/qemu-core-os-rc-report.json
            build/qemu-storage-crash-failure.log
            build/qemu-smmu-gate-report.json
            build/qemu-smmu-gate.log
            build/qemu-nvme-gate-report.json
            build/qemu-outbound-fragmentation-report.json
            build/qemu-high-core-gate-report.json
            build/qemu-high-core-gate.log
            build/qemu-milestone-53-fault-injection.json
            build/qemu-milestone-57-network-suite.json
          if-no-files-found: ignore
          retention-days: 14

  regression:
    name: Regression Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build qemu-system-arm qemu-efi-aarch64 mtools python3 python3-cryptography

      - name: Build disk image
        run: make image-qemu-test

      - name: Run regression suite
        run: python3 tests/scripts/qemu-regression-suite.py
        env:
          XAIOS_QEMU_SMOKE_TIMEOUT: "120"

  parser-fuzz:
    name: Parser Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm python3

      # Every one of these parsers is reachable before authentication: the SSH
      # binary packet layer, the DNS/DNSSEC response path, and the SFTP request
      # decoder. The corpus is carried between runs so each campaign starts
      # from the coverage the previous one reached instead of from one seed.
      - name: Restore fuzzing corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz
          key: parser-fuzz-corpus-${{ github.sha }}
          restore-keys: |
            parser-fuzz-corpus-

      - name: Run bounded coverage-guided campaign
        run: make parser-fuzz
        env:
          XAIOS_FUZZ_RUNS: "300000"

      - name: Upload crashes and corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parser-fuzz-evidence
          path: |
            build/fuzz/*-corpus/**
            build/fuzz/crash-*
            build/fuzz/leak-*
            build/fuzz/timeout-*
          if-no-files-found: ignore
          retention-days: 14

  persistence-reboot:
    name: Persistence Across Reboot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build qemu-system-arm qemu-efi-aarch64 mtools python3 python3-cryptography

      # Boots twice against one VirtIO volume and requires the second boot to
      # reload the state the first wrote. Nothing else in CI covers durability
      # across a restart, which is how a persistence subsystem that wrote to a
      # snapshot-backed device went unnoticed.
      - name: Verify snapshot state survives a reboot
        run: make qemu-persistence-reboot
        env:
          XAIOS_QEMU_PERSISTENCE_TIMEOUT: "180"

  model-storage-interoperability:
    name: xaiFS SFTP Interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install QEMU and OpenSSH dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build qemu-system-arm qemu-efi-aarch64 mtools openssh-client python3 python3-cryptography

      - name: Run concurrent host and Debian xaiFS lifecycle gate
        run: make qemu-model-sftp-gate

      - name: Upload xaiFS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qemu-model-sftp-evidence
          path: |
            build/qemu-model-sftp-gate.log
            build/qemu-model-sftp-firmware-attempt-1.log
          if-no-files-found: ignore
          retention-days: 14

  network-interoperability:
    name: Linux OpenSSH Interoperability (Debian 13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build qemu-system-arm qemu-efi-aarch64 mtools python3 python3-cryptography

      - name: Run SSH, SFTP, UDP, and IPv6/TCP gate
        run: make qemu-docker-network-suite

      - name: Upload network evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qemu-network-evidence
          path: |
            build/qemu-docker-network-suite.json
            build/qemu-docker-network-suite.pcap
            build/qemu-docker-*.log
          retention-days: 14

  freebsd-network-interoperability:
    name: FreeBSD 15.1 Bidirectional Interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build qemu-system-arm qemu-utils qemu-efi-aarch64 mtools python3 python3-cryptography xz-utils genisoimage

      - name: Cache pinned FreeBSD client image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/xaios/freebsd
          key: freebsd-15.1-release-aarch64-cloudinit-9722aea499610802

      - name: Verify Docker runtime
        run: docker info

      - name: Run bidirectional FreeBSD SSH, SFTP, SCP, PTY, and UDP gate
        run: make qemu-freebsd-bidirectional-suite
        env:
          XAIOS_FREEBSD_TIMEOUT: "900"

      - name: Upload FreeBSD interoperability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qemu-freebsd-network-evidence
          path: |
            build/qemu-freebsd-bidirectional-aarch64.json
            build/qemu-freebsd-docker-aarch64.log
            build/qemu-freebsd-bidirectional-xaios-aarch64.log
          if-no-files-found: ignore
          retention-days: 14

  publish-wiki:
    name: Publish curated Wiki
    # The repository holds the curated Wiki under wiki/ and gates its layout and
    # links, but the published Wiki is a separate repository that nothing kept
    # level, so it drifted across several rounds of work. Publish only after the
    # documentation contract passes, so a Wiki that fails its own gate is never
    # the one people read.
    needs: documentation-contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Pummelchen/XAIOS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # The published Wiki is one branch of one repository, so two runs of this
    # job cannot both write it: the second push is the only one that survives.
    # Serialise them, and let a newer pending run replace an older one rather
    # than cancelling a push that is already in flight.
    concurrency:
      group: publish-wiki
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish wiki/ to the repository Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A run of this job can outlive the push that started it, and one
          # did. The run for 023afed0 spent about six hours queued and pushed
          # its copy of the Wiki at 12:54:21Z, thirty-five seconds *after* the
          # run for 8345bb2 had pushed a newer one -- so the published
          # Project-Tracker went backwards by 98 lines, no job failed, and
          # nothing reported it. Everything after that read the older page.
          #
          # Publishing is only ever correct for the commit that is still the
          # tip of main, so ask which commit that is and stand down if it is
          # not this one. A newer push has a run of this job of its own, and
          # standing down is not a failure: it is this run correctly declining
          # to publish something that is no longer current.
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${tip}" != "${GITHUB_SHA}" ]; then
            printf 'wiki: %s is no longer the tip of main (%s); standing down\n' \
              "${GITHUB_SHA}" "${tip}"
            exit 0
          fi

          git clone --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "${RUNNER_TEMP}/wiki"
          # Report anything published that the repository no longer carries,
          # rather than deleting it. The layout gate owns the page set, so an
          # orphan here means the two disagree and a person should look.
          for published in "${RUNNER_TEMP}"/wiki/*.md; do
            page="$(basename "${published}")"
            case "${page}" in _*) continue ;; esac
            if [ ! -f "wiki/${page}" ]; then
              echo "wiki: ${page} is published but absent from wiki/; leaving it in place"
            fi
          done
          cp wiki/*.md "${RUNNER_TEMP}/wiki/"
          cd "${RUNNER_TEMP}/wiki"
          if [ -z "$(git status --porcelain)" ]; then
            echo "wiki: already level with the repository"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Sync the curated Wiki from ${GITHUB_SHA}"

            # Somebody can still have written the published Wiki between the
            # clone above and this push. There is no merge to do here: this
            # repository is the source of truth and CONTRIBUTING.md says an
            # edit made on the published pages is overwritten by the next
            # merge, so on a rejected push the tree that belongs on top of the
            # published tip is this one. Re-apply it there and try again.
            attempt=0
            while :; do
              attempt=$((attempt + 1))
              if git push origin HEAD; then
                echo "wiki: published ${GITHUB_SHA}"
                break
              fi
              if [ "${attempt}" -ge 3 ]; then
                echo "wiki: push rejected ${attempt} times; giving up" >&2
                exit 1
              fi
              echo "wiki: push rejected; re-applying to the published tip (attempt ${attempt})"
              git fetch --depth 1 origin HEAD
              git reset --soft FETCH_HEAD
              git add -A
              git commit -m "Sync the curated Wiki from ${GITHUB_SHA}"
            done
          fi

          # Compare what is published against what this repository carries, by
          # reading it back from the remote rather than trusting the directory
          # that was just pushed -- a check that compares a copy with itself
          # proves nothing. risk R-012 claims this comparison exists, and it
          # did not until now.
          cd "${GITHUB_WORKSPACE}"
          python3 tests/repository/check-wiki-parity.py
