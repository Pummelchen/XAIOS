name: XAIOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-check:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Compile-check kernel C files
        run: make compile-check

  hosted-engine:
    name: Hosted Engine & Model v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang python3

      - name: Run hosted engine tests
        run: make hosted-test

  documentation-contract:
    name: Documentation Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check support status synchronization
        run: python3 scripts/check-model-support.py

  abi-contract:
    name: ABI Contract Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Validate ABI contract
        run: python3 scripts/qemu-abi-contract.py

  build-and-smoke:
    name: Build & QEMU Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-arm qemu-efi-aarch64 mtools python3

      - name: Build disk image
        run: make image

      - name: QEMU smoke test
        run: python3 scripts/qemu-smoke.py
        env:
          XAIOS_QEMU_SMOKE_TIMEOUT: "120"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/*.img
            build/kernel/kernel.elf
            build/uefi/BOOTAA64.EFI
          retention-days: 7

  regression:
    name: Regression Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-arm qemu-efi-aarch64 mtools python3

      - name: Build disk image
        run: make image

      - name: Run regression suite
        run: python3 scripts/qemu-regression-suite.py
        env:
          XAIOS_QEMU_SMOKE_TIMEOUT: "120"

  network-interoperability:
    name: Debian 13 Network Interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-arm qemu-efi-aarch64 mtools python3

      - name: Run SSH, SFTP, UDP, and IPv6/TCP gate
        run: make qemu-docker-network-suite

      - name: Upload network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-network-evidence
          path: |
            build/qemu-docker-network-suite.json
            build/qemu-docker-network-suite.pcap
            build/qemu-docker-*.log
          retention-days: 14
